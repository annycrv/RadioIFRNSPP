{% load static %}

<div class="filtros-apresentadores mb-4">

    <form id="form-pesquisa-apresentadores"
          class="d-flex gap-3 align-items-center flex-grow-1">

        <div class="search-wrapper flex-grow-1">

            <i class="bi bi-search"></i>

            <input
                id="campo-pesquisa-apresentador"
                class="form-control"
                type="search"
                name="f"
                value="{{ request.GET.f }}"
                placeholder="Pesquisar por apresentador...">

        </div>

    </form>

</div>


<div class="table-responsive">

    <table class="table tabela-apresentadores align-middle mb-0">

        <thead>
            <tr>
                <th>Foto</th>
                <th>Nome</th>
                <th class="text-center">Ações</th>
            </tr>
        </thead>

        <tbody>

        {% for apresentador in apresentadores %}

        <tr>

            <td>

                {% if apresentador.foto %}

                    <img
                        src="{{ apresentador.foto.url }}"
                        class="foto-apresentador">

                {% else %}

                    <img
                        src="{% static 'radio/img/avatarpadrao.jpg' %}"
                        class="foto-apresentador">

                {% endif %}

            </td>


            <td>

                <div class="nome-apresentador">
                    {{ apresentador.nome }}
                </div>

            </td>


            <td>

                <div class="acoes">

                    <a
                        href="{% url 'dashboard:apresentador_editar' apresentador.id %}"
                        class="btn-editar"
                        title="Editar">

                        <i class="bi bi-pencil"></i>

                    </a>


                    <a
                        href="{% url 'dashboard:apresentador_remover' apresentador.id %}"
                        class="remover"
                        title="Excluir">

                        <i class="bi bi-trash"></i>

                    </a>

                </div>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="3" class="text-center py-5">

                <img
                    src="{% static 'radio/img/avatar.svg' %}"
                    width="120"
                    class="mb-3">

                <p class="text-muted mb-0">
                    Nenhum apresentador cadastrado.
                </p>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>
