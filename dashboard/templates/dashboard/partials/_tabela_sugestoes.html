<div class="filtros-crud mb-4">

    <form id="form-pesquisa-sugestoes"
          class="d-flex gap-3 align-items-center flex-grow-1">

        <div class="search-wrapper flex-grow-1">

            <i class="bi bi-search"></i>

            <input
                id="campo-pesquisa-sugestao"
                class="form-control"
                type="search"
                name="f"
                value="{{ request.GET.f }}"
                placeholder="Pesquisar por nome ou comentário...">

        </div>

    </form>

</div>


<div class="table-responsive">

    <table class="table tabela-crud tabela-sugestoes align-middle mb-0">

        <thead>
            <tr>

                <th>
                    <a href="{% querystring ordenar='nome' %}">
                        Nome
                    </a>
                </th>

                <th>
                    <a href="{% querystring ordenar='comentario' %}">
                        Comentário
                    </a>
                </th>

                <th class="text-center">
                    Ações
                </th>

            </tr>
        </thead>


        <tbody>

        {% for item in sugestao %}

        <tr>

            <td>
                <div class="nome-sugestao">
                    {{ item.nome }}
                </div>
            </td>


            <td class="comentario-sugestao">
                {{ item.comentario|truncatewords:12 }}
            </td>


            <td>

                <div class="acoes">

                    <a
                        href="{% url 'dashboard:sugestoes_remover' item.id %}"
                        class="remover"
                        title="Excluir">

                        <i class="bi bi-trash"></i>

                    </a>

                </div>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="3" class="text-center py-5">

                <i class="bi bi-chat-left-text fs-1 text-muted mb-3 d-block"></i>

                <p class="text-muted mb-0">
                    Nenhuma sugestão enviada ainda.
                </p>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>
