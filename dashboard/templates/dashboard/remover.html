
<div class="card card-remover shadow-sm">

    <div class="card-body">

        <h3 class="titulo-remover mb-3">
            Remover {{ tipo }}
        </h3>

        <p class="texto-remover">
            Tem certeza que deseja remover
            <strong>{{ objeto }}</strong>?
        </p>

        <form
            method="POST"
            class="form-remover"
            action="{{ url_remover }}"
        >

            {% csrf_token %}

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="button"
                        class="btn btn-danger confirmar">
                    <i class="bi bi-trash3 me-1"></i>
                    Sim, remover
                </button>

            </div>

        </form>

    </div>

</div>
